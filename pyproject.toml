
[project]
name = "event-booking-system"
version = "1.0.0"
description = "Role-based event booking API with asynchronous email jobs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.41,<1.0",
    "sqlalchemy[asyncio]>=2.0.48,<3.0",
    "asyncpg>=0.31,<1.0",
    "pydantic-settings>=2.12,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "email-validator>=2.2,<3.0",
    "arq>=0.28,<1.0",
    "redis>=5,<6",
    "httpx>=0.28,<1.0",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.14,<1.0",
    "locust>=2.43,<3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
